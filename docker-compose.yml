services:
  # ---------------------------------------------------------------------------
  # Jellyfin — media server: indexa a biblioteca já organizada e serve pela rede
  # ---------------------------------------------------------------------------
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ:-UTC}
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
      # Descoberta automática na rede local (apps de celular/TV "acham" o
      # servidor sozinhos). Descomente se quiser essa conveniência.
      - "1900:1900/udp"
      - "7359:7359/udp"
    volumes:
      - ${CONFIG_ROOT}/jellyfin:/config
      - ${JELLYFIN_CACHE_DIR}:/cache
      # Somente leitura: o Jellyfin só serve o que o Radarr/Sonarr já
      # organizaram, nunca deveria escrever na biblioteca.
      - ${DATA_ROOT}/media:/data/media:ro
    # Descomente para transcodificação por hardware (Intel Quick Sync / AMD VA-API)
    # devices:
    #   - /dev/dri:/dev/dri
    networks:
      - media-vault

  # ---------------------------------------------------------------------------
  # Prowlarr — gerenciador central de indexadores, sincroniza com Radarr/Sonarr
  # ---------------------------------------------------------------------------
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ:-UTC}
    ports:
      - "${PROWLARR_PORT:-9696}:9696"
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    depends_on:
      - byparr
    networks:
      - media-vault

  # ---------------------------------------------------------------------------
  # Byparr — resolve desafios Cloudflare/Turnstile para indexadores protegidos.
  # Fala a mesma API do FlareSolverr clássico (porta 8191), então no Prowlarr
  # ele se configura como um proxy de indexador do tipo "FlareSolverr" —
  # é só apontar o Host para http://byparr:8191, sem mudar mais nada lá.
  # ---------------------------------------------------------------------------
  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    restart: unless-stopped
    # Roda um navegador de verdade (Camoufox) por dentro — precisa de memória
    # compartilhada suficiente ou o processo do navegador cai/trava.
    shm_size: 1gb
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-UTC}
    ports:
      - "${BYPARR_PORT:-8191}:8191"
    networks:
      - media-vault

  # ---------------------------------------------------------------------------
  # qBittorrent — cliente de download
  # ---------------------------------------------------------------------------
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=${QBITTORRENT_PORT:-8080}
      - TORRENTING_PORT=${QBITTORRENT_TORRENTING_PORT:-6881}
    ports:
      - "${QBITTORRENT_PORT:-8080}:${QBITTORRENT_PORT:-8080}"
      - "${QBITTORRENT_TORRENTING_PORT:-6881}:${QBITTORRENT_TORRENTING_PORT:-6881}/tcp"
      - "${QBITTORRENT_TORRENTING_PORT:-6881}:${QBITTORRENT_TORRENTING_PORT:-6881}/udp"
    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      # Só enxerga a área de downloads — nunca a biblioteca final.
      - ${DATA_ROOT}/torrents:/data/torrents
    networks:
      - media-vault

  # ---------------------------------------------------------------------------
  # Radarr — automação de filmes
  # ---------------------------------------------------------------------------
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ:-UTC}
    ports:
      - "${RADARR_PORT:-7878}:7878"
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      # Raiz inteira: o Radarr precisa ver /data/torrents (origem) e
      # /data/media (destino) no MESMO caminho que o qBittorrent usa, para
      # conseguir fazer hardlink em vez de copiar o arquivo na importação.
      - ${DATA_ROOT}:/data
    depends_on:
      - qbittorrent
    networks:
      - media-vault

  # ---------------------------------------------------------------------------
  # Sonarr — automação de séries
  # ---------------------------------------------------------------------------
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ:-UTC}
    ports:
      - "${SONARR_PORT:-8989}:8989"
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${DATA_ROOT}:/data
    depends_on:
      - qbittorrent
    networks:
      - media-vault

  # ---------------------------------------------------------------------------
  # Bazarr — legendas para o que o Radarr/Sonarr já baixaram e organizaram
  # ---------------------------------------------------------------------------
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ:-UTC}
    ports:
      - "${BAZARR_PORT:-6767}:6767"
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      # Só precisa da biblioteca final — mesmo caminho usado por Jellyfin/Radarr/Sonarr.
      - ${DATA_ROOT}/media:/data/media
    depends_on:
      - radarr
      - sonarr
    networks:
      - media-vault

  # ---------------------------------------------------------------------------
  # Jellyseerr — descoberta e pedidos de mídia pelos usuários
  # ---------------------------------------------------------------------------
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    init: true
    environment:
      - TZ=${TZ:-UTC}
    ports:
      - "${JELLYSEERR_PORT:-5055}:5055"
    volumes:
      - ${CONFIG_ROOT}/jellyseerr:/app/config
    depends_on:
      - jellyfin
      - radarr
      - sonarr
    networks:
      - media-vault

  # ---------------------------------------------------------------------------
  # Unpackerr — extrai .rar/.zip automaticamente antes do Radarr/Sonarr importar
  # ---------------------------------------------------------------------------
  unpackerr:
    image: golift/unpackerr:latest
    container_name: unpackerr
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ:-UTC}
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_SONARR_0_PATH=/data/torrents/tv
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
      - UN_RADARR_0_PATH=/data/torrents/movies
    volumes:
      # Mesmo caminho /data/torrents usado por qBittorrent e Radarr/Sonarr.
      - ${DATA_ROOT}/torrents:/data/torrents
    depends_on:
      - qbittorrent
      - radarr
      - sonarr
    networks:
      - media-vault

networks:
  media-vault:
    name: media-vault
    driver: bridge